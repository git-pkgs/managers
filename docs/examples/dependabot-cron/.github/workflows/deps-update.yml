# Dependency Update Workflow
#
# Runs weekly to check for outdated dependencies and create PRs.
# Uses the managers library to support multiple package managers.

name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

permissions: {}

jobs:
  update-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # Full history for branch operations
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      # Install package managers that might be needed
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.3'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Set up Python and uv
        run: |
          pip install uv

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build updater
        run: |
          # Clone and build the updater tool
          # In practice, you'd either:
          # 1. Include the tool in your repo
          # 2. Install it as a binary
          # 3. Use a pre-built action

          git clone --depth 1 https://github.com/git-pkgs/managers /tmp/managers
          cd /tmp/managers/docs/examples/dependabot-cron
          go build -o /tmp/deps-update .

      - name: Run dependency updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          /tmp/deps-update "$GITHUB_WORKSPACE"

      - name: Summary
        run: |
          {
            echo "## Dependency Update Summary"
            echo ""
            echo "Check the Pull Requests tab for any new update PRs."
          } >> "$GITHUB_STEP_SUMMARY"
